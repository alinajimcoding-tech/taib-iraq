// دالة عرض الموردين مع توليد رابط مباشر لبحث علي بابا
function showTraders() {
    const selectedProduct = document.getElementById("productSelect").value;
    const container = document.getElementById("recommendationsContainer");
    const tbody = document.getElementById("tradersBody");

    tbody.innerHTML = "";

    if (selectedProduct) {
        const traders = productsDatabase[selectedProduct] || [];

        if (traders.length > 0) {
            traders.forEach(trader => {
                const searchQuery = encodeURIComponent(`${trader.product_title} ${trader.company_name}`);
                const alibabaUrl = `https://www.alibaba.com/trade/search?SearchText=${searchQuery}`;

                const row = `
                    <tr>
                        <td>
                            <a href="${alibabaUrl}" target="_blank" class="alibaba-link" title="انقر للانتقال لعلي بابا">
                                🏢 ${trader.company_name}
                            </a>
                        </td>
                        <td>
                            <a href="${alibabaUrl}" target="_blank" class="alibaba-link" title="انقر لرؤية المنتج في علي بابا">
                                📦 ${trader.product_title}
                            </a>
                        </td>
                        <td class="price">${trader.price}</td>
                        <td class="moq">${trader.moq}</td>
                        <td class="rating">${trader.rating}</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        } else {
            tbody.innerHTML = `<tr><td colspan="5" class="no-data">لا توجد بيانات مضافة حالياً لهذا المنتج.</td></tr>`;
        }
        container.style.display = "block";
    } else {
        container.style.display = "none";
    }
}
</script>
